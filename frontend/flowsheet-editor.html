<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flowsheet Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1e293b; color: #f1f5f9; display: flex; flex-direction: column; height: 100vh; }

    #toolbar {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      background: #0f172a; border-bottom: 1px solid #334155; flex-shrink: 0; flex-wrap: wrap;
    }
    #toolbar label { font-size: 0.8rem; color: #94a3b8; }
    #toolbar select, #toolbar input[type=text] {
      background: #1e293b; border: 1px solid #475569; color: #f1f5f9;
      border-radius: 4px; padding: 4px 8px; font-size: 0.8rem;
    }
    #toolbar select { width: 240px; }
    #toolbar input[type=text] { width: 320px; }
    #toolbar button {
      background: #2563eb; color: white; border: none; border-radius: 4px;
      padding: 5px 12px; font-size: 0.8rem; cursor: pointer;
    }
    #toolbar button:hover { background: #1d4ed8; }
    #toolbar button.secondary { background: #475569; }
    #toolbar button.secondary:hover { background: #334155; }
    #btn-copy { background: #16a34a; }
    #btn-copy:hover { background: #15803d; }
    #btn-copy.copied { background: #475569; }

    #workspace { flex: 1; overflow: auto; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }

    #canvas-wrap {
      position: relative; display: inline-block;
      box-shadow: 0 4px 32px rgba(0,0,0,0.5);
    }

    #bg-img { display: block; max-width: 100%; height: auto; pointer-events: none; user-select: none; }

    .btn-editor {
      position: absolute; transform: translate(-50%, -50%);
      background: rgba(15,23,42,0.85); color: #f1f5f9;
      border: 1.5px solid #3b82f6; border-radius: 4px;
      padding: 2px 7px; font-size: 0.7rem; font-weight: 600;
      cursor: grab; user-select: none; white-space: nowrap;
      transition: border-color 0.1s, background 0.1s;
    }
    .btn-editor:active { cursor: grabbing; }
    .btn-editor.selected { border-color: #f59e0b; background: rgba(245,158,11,0.2); z-index: 10; }
    .btn-editor.bool { border-color: #a855f7; }
    .btn-editor.bool.selected { border-color: #f59e0b; }

    #output-wrap { padding: 0 20px 20px; flex-shrink: 0; }
    #output {
      background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      padding: 12px; font-family: monospace; font-size: 0.72rem; color: #7dd3fc;
      max-height: 160px; overflow-y: auto; white-space: pre; display: none;
    }

    #status { font-size: 0.75rem; color: #64748b; margin-left: auto; }
    #instructions { font-size: 0.75rem; color: #64748b; }
  </style>
</head>
<body>

<div id="toolbar">
  <label>Flowsheet:</label>
  <select id="fs-select" onchange="loadFromSelect()">
    <option value="tk1">TK1 Solución Rica (general)</option>
    <option value="adr">ADR → Desadsorción Lavado Ácido</option>
    <option value="adorcion">ADR → Adsorción de Carbón</option>
    <option value="ampliacion">ADR Ampliación Adsorción</option>
    <option value="desadsorcion">ADR Desadsorción</option>
    <option value="reactivos">ADR Reactivos Amp. Hidróxido</option>
    <option value="cianuro">ADR Reactivos Sistema Cianuro</option>
    <option value="naoh">Preparación NaOH</option>
    <option value="servicios">Servicios Planta Agua</option>
    <option value="tanques">Tanques Solución Rica y Pobre</option>
    <option value="tk1rica">Tanque TK1 Solución Rica</option>
  </select>
  <label>URL imagen:</label>
  <input type="text" id="img-url" value="">
  <button onclick="loadImage()">Cargar imagen</button>
  <button id="btn-copy" onclick="copyHTML()">Copiar HTML</button>
  <span id="status"></span>
  <span id="instructions">Arrastrá · Click = seleccionar · Supr = eliminar seleccionado</span>
</div>

<div id="workspace">
  <div id="canvas-wrap">
    <img id="bg-img" src="" alt="Flowsheet">
  </div>
</div>

<div id="output-wrap">

</div>

const wrap = document.getElementById('canvas-wrap');
const img  = document.getElementById('bg-img');
let selected = null;

function loadFromSelect() {
  const key = document.getElementById('fs-select').value;
  const fs = FLOWSHEETS[key];
  document.getElementById('img-url').value = fs.image;
  img.src = fs.image;
  img.onload = () => {
    setStatus(`${fs.buttons.length} botones — ${img.naturalWidth}×${img.naturalHeight}`);
    wrap.querySelectorAll('.btn-editor').forEach(el => el.remove());
    fs.buttons.forEach(b => addButton(b));
  };
  img.onerror = () => setStatus('Error al cargar imagen');
}

function loadImage() {
  const url = document.getElementById('img-url').value.trim();
  img.src = url;
  img.onload = () => setStatus(`Imagen cargada (${img.naturalWidth}×${img.naturalHeight})`);
  img.onerror = () => setStatus('Error al cargar imagen — CORS o URL inválida');
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

function addButton(b) {
  const el = document.createElement('div');
  el.className = 'btn-editor' + (b.unit === 'bool' ? ' bool' : '');
  el.title = b.title;
  el.textContent = b.title;
  el.dataset.codigo   = b.codigo;
  el.dataset.decimals = b.decimals;
  el.dataset.unit     = b.unit;
  el.style.left = b.left + '%';
  el.style.top  = b.top  + '%';
  makeDraggable(el);
  wrap.appendChild(el);
  return el;
}

function makeDraggable(el) {
  let startX, startY, startL, startT;

  el.addEventListener('mousedown', e => {
    e.preventDefault();
    select(el);
    const rect = wrap.getBoundingClientRect();
    startX = e.clientX;
    startY = e.clientY;
    startL = parseFloat(el.style.left);
    startT = parseFloat(el.style.top);

    function onMove(e) {
      const dx = (e.clientX - startX) / rect.width  * 100;
      const dy = (e.clientY - startY) / rect.height * 100;
      el.style.left = (startL + dx).toFixed(2) + '%';
      el.style.top  = (startT + dy).toFixed(2) + '%';
      updateOutput();
    }

    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function select(el) {
  if (selected) selected.classList.remove('selected');
  selected = el;
  el.classList.add('selected');
}

document.addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected) {
    selected.remove();
    selected = null;
    updateOutput();
  }
});

function getButtons() {
  return [...wrap.querySelectorAll('.btn-editor')].map(el => ({
    codigo:   el.dataset.codigo,
    decimals: el.dataset.decimals,
    unit:     el.dataset.unit,
    title:    el.title,
    left:     parseFloat(el.style.left).toFixed(2),
    top:      parseFloat(el.style.top).toFixed(2),
  }));
}

function updateOutput() {
  const out = document.getElementById('output');
  out.style.display = 'block';
  out.textContent = generateHTML();
}

function generateHTML() {
  return getButtons().map(b => {
    const href = `index.html?codigo=${b.codigo}&unit=${b.unit}`;
    return `  <a href="${href}" class="scada-btn" data-codigo="${b.codigo}" data-decimals="${b.decimals}" data-unit="${b.unit}" style="left:${b.left}%;top:${b.top}%" title="${b.title}">–</a>`;
  }).join('\n');
}

function copyHTML() {
  const html = generateHTML();
  const btn = document.getElementById('btn-copy');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(html).then(() => flash(btn));
  } else {
    const ta = document.createElement('textarea');
    ta.value = html;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    flash(btn);
  }
}

function flash(btn) {
  btn.textContent = '✓ Copiado';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copiar HTML'; btn.classList.remove('copied'); }, 2000);
}

// Cargar primer flowsheet al iniciar
loadFromSelect();
