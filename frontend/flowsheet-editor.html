<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flowsheet Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1e293b; color: #f1f5f9; display: flex; flex-direction: column; height: 100vh; }

    #toolbar {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      background: #0f172a; border-bottom: 1px solid #334155; flex-shrink: 0; flex-wrap: wrap;
    }
    #toolbar label { font-size: 0.8rem; color: #94a3b8; white-space: nowrap; }
    #toolbar select, #toolbar input[type=text] {
      background: #1e293b; border: 1px solid #475569; color: #f1f5f9;
      border-radius: 4px; padding: 4px 8px; font-size: 0.8rem;
    }
    #fs-select { width: 320px; }
    #img-url   { width: 280px; }
    #toolbar button {
      background: #2563eb; color: white; border: none; border-radius: 4px;
      padding: 5px 12px; font-size: 0.8rem; cursor: pointer; white-space: nowrap;
    }
    #toolbar button:hover { background: #1d4ed8; }
    #btn-copy { background: #16a34a; }
    #btn-copy:hover { background: #15803d; }
    #btn-copy.copied { background: #475569; }

    #workspace { flex: 1; overflow: auto; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }

    #canvas-wrap { position: relative; display: inline-block; box-shadow: 0 4px 32px rgba(0,0,0,0.5); }
    #bg-img { display: block; max-width: 100%; height: auto; pointer-events: none; user-select: none; }

    .btn-editor {
      position: absolute; transform: translate(-50%, -50%);
      background: rgba(15,23,42,0.85); color: #f1f5f9;
      border: 1.5px solid #3b82f6; border-radius: 4px;
      padding: 2px 7px; font-size: 0.7rem; font-weight: 600;
      cursor: grab; user-select: none; white-space: nowrap;
    }
    .btn-editor:active { cursor: grabbing; }
    .btn-editor.selected { border-color: #f59e0b; background: rgba(245,158,11,0.2); z-index: 10; }
    .btn-editor.bool { border-color: #a855f7; }
    .btn-editor.bool.selected { border-color: #f59e0b; }

    #output-wrap { padding: 0 20px 20px; flex-shrink: 0; }
    #output {
      background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      padding: 12px; font-family: monospace; font-size: 0.72rem; color: #7dd3fc;
      max-height: 160px; overflow-y: auto; white-space: pre; display: none;
    }
    #status { font-size: 0.75rem; color: #64748b; margin-left: auto; }
    #instructions { font-size: 0.75rem; color: #64748b; }
  </style>
</head>
<body>

<div id="toolbar">
  <label>Flowsheet:</label>
  <select id="fs-select" onchange="onFlowsheetChange()">
    <option value="tk1">1 - Tanque Solución Rica, Gastada y Piletas</option>
    <option value="cal">10 - Planta de Cal Hidróxido</option>
  </select>

  <label>URL imagen:</label>
  <input type="text" id="img-url">
  <button onclick="loadImage()">Cargar</button>
  <button id="btn-copy" onclick="copyHTML()">Copiar HTML</button>
  <span id="status"></span>
  <span id="instructions">Arrastrá · Click = seleccionar · Supr = eliminar</span>
</div>

<div id="workspace">
  <div id="canvas-wrap">
    <img id="bg-img" src="" alt="Flowsheet">
  </div>
</div>

<div id="output-wrap">
  <div id="output"></div>
</div>

<script>

    buttons: [

      { codigo:'004', decimals:2, unit:'bar',  left:16.71, top:39.36, title:'PI880' },
      { codigo:'127', decimals:0, unit:'bool', left:19.67, top:47.93, title:'610-PP-024' },
      { codigo:'137', decimals:0, unit:'bool', left:26.75, top:45.17, title:'610-PP-012' },

      { codigo:'140', decimals:0, unit:'bool', left:31.75, top:84.62, title:'610-PP-023' },
      { codigo:'100', decimals:2, unit:'pct',  left:59.38, top:53.55, title:'LI1120' },
      { codigo:'099', decimals:2, unit:'pct',  left:59.19, top:61.05, title:'TK 15C LI 1120C' },
      { codigo:'244', decimals:2, unit:'pct',  left:94.07, top:46.29, title:'LI1011C' },
      { codigo:'008', decimals:2, unit:'m3',   left:83.48, top:59.09, title:'FI885' },

      { codigo:'053', decimals:2, unit:'m3',   left:96.41, top:75.68, title:'FQ874' },

    ],
  },
  cal: {
    imageUrl: 'http://10.91.1.229:88/images/Plantadecalhidroxido.png',
    buttons: [
      { codigo:'284', decimals:2, unit:'bool', left:24.64, top:37.06, title:'HV-027' },
      { codigo:'300', decimals:2, unit:'bool', left:7.37,  top:58.12, title:'620-PP-032A' },

      { codigo:'098', decimals:2, unit:'m3',   left:59.26, top:60.90, title:'620LIT1302' },

      { codigo:'307', decimals:2, unit:'m3',   left:89.90, top:66.01, title:'FIFE003' },
      { codigo:'213', decimals:2, unit:'m3',   left:75.55, top:84.11, title:'LI1011' },

      { codigo:'116', decimals:2, unit:'ph',   left:75.55, top:91.30, title:'AI1016' },
      { codigo:'117', decimals:2, unit:'ph',   left:80.90, top:91.30, title:'AI1016C' },
    ],
  },
};

const wrap = document.getElementById('canvas-wrap');
const img  = document.getElementById('bg-img');
let selected = null;

function onFlowsheetChange() {
  const key = document.getElementById('fs-select').value;
  const fs  = FLOWSHEETS[key];
  document.getElementById('img-url').value = fs.imageUrl;
  img.src = fs.imageUrl;
  img.onload = () => {
    setStatus(`${img.naturalWidth}×${img.naturalHeight} — ${fs.buttons.length} botones`);
    wrap.querySelectorAll('.btn-editor').forEach(el => el.remove());
    selected = null;
    fs.buttons.forEach(b => addButton(b));
    updateOutput();
  };
  img.onerror = () => setStatus('Error al cargar imagen — CORS o URL inválida');
}

function loadImage() {
  img.src = document.getElementById('img-url').value.trim();
  img.onload = () => setStatus(`${img.naturalWidth}×${img.naturalHeight}`);
  img.onerror = () => setStatus('Error al cargar imagen');
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

function addButton(b) {
  const el = document.createElement('div');
  el.className = 'btn-editor' + (b.unit === 'bool' ? ' bool' : '');
  el.title = b.title;
  el.textContent = b.title;
  el.dataset.codigo   = b.codigo;
  el.dataset.decimals = b.decimals;
  el.dataset.unit     = b.unit;
  el.style.left = b.left + '%';
  el.style.top  = b.top  + '%';
  makeDraggable(el);
  wrap.appendChild(el);
}

function makeDraggable(el) {
  el.addEventListener('mousedown', e => {
    e.preventDefault();
    select(el);
    const rect = wrap.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY;
    const startL = parseFloat(el.style.left), startT = parseFloat(el.style.top);

    function onMove(e) {
      el.style.left = (startL + (e.clientX - startX) / rect.width  * 100).toFixed(2) + '%';
      el.style.top  = (startT + (e.clientY - startY) / rect.height * 100).toFixed(2) + '%';
      updateOutput();
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function select(el) {
  if (selected) selected.classList.remove('selected');
  selected = el;
  el.classList.add('selected');
}

document.addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected) {
    selected.remove();
    selected = null;
    updateOutput();
  }
});

function getButtons() {
  return [...wrap.querySelectorAll('.btn-editor')].map(el => ({
    codigo:   el.dataset.codigo,
    decimals: el.dataset.decimals,
    unit:     el.dataset.unit,
    title:    el.title,
    left:     parseFloat(el.style.left).toFixed(2),
    top:      parseFloat(el.style.top).toFixed(2),
  }));
}

function updateOutput() {
  const out = document.getElementById('output');
  out.style.display = 'block';
  out.textContent = generateHTML();
}

function generateHTML() {
  return getButtons().map(b =>
    `  <a href="../index.html?codigo=${b.codigo}&unit=${b.unit}" class="scada-btn" data-codigo="${b.codigo}" data-decimals="${b.decimals}" data-unit="${b.unit}" style="left:${b.left}%;top:${b.top}%" title="${b.title}">–</a>`
  ).join('\n');
}

function copyHTML() {
  const html = generateHTML();
  const btn = document.getElementById('btn-copy');
  const ok = () => {
    btn.textContent = '✓ Copiado';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copiar HTML'; btn.classList.remove('copied'); }, 2000);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(html).then(ok).catch(() => fallback(html, ok));
  } else {
    fallback(html, ok);
  }
}

function fallback(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  cb();
}

onFlowsheetChange();
</script>
</body>
</html>
