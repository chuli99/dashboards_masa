<script src="../config.js"></script>
<script>
const API = window.API_URL || `http://${window.location.hostname}:5050`;
const REFRESH_MS = 60000;
const UNIT_SUFFIX = { m3: ' m³', ph: ' pH', bar: ' bar', pct: ' %' };

function formatVal(val, decimals, unit) {
  if (unit === 'bool') return val >= 1 ? 'On' : 'Off';
  return val.toFixed(decimals) + (UNIT_SUFFIX[unit] || '');
}

async function cargarValores() {
  const btns = [...document.querySelectorAll('.scada-btn')];
  const codigos = [...new Set(btns.map(b => b.dataset.codigo))];

  const resultados = await Promise.allSettled(
    codigos.map(c => fetch(`${API}/api/variables/${c}/last`).then(r => r.json()))
  );

  const mapa = {};
  resultados.forEach((r, i) => {
    if (r.status === 'fulfilled' && r.value.valor !== undefined) mapa[codigos[i]] = r.value.valor;
  });

  btns.forEach(btn => {
    const val = mapa[btn.dataset.codigo];
    if (val !== undefined) btn.textContent = formatVal(val, parseInt(btn.dataset.decimals), btn.dataset.unit);
  });
}

cargarValores();
setInterval(cargarValores, REFRESH_MS);
</script>
